---
layout: project
---
<div class="project-content markdown-project">
  {% if content != blank %}
  {{ content }}
  {% elsif page.images %}
  <section class="project-section">
    <h2>Gallery</h2>
    <div class="gallery-grid photo-grid">
      {% for image in page.images %}
      <figure class="gallery-item"><a href="{{ image | relative_url }}"><img src="{{ image | relative_url }}" alt="{{ page.title | escape }} photograph {{ forloop.index }}" loading="lazy"></a></figure>
      {% endfor %}
    </div>
  </section>
  {% endif %}
</div>
